# system-map 1d (D27): component tests run under happy-dom with bun:test — no extra runner.
# The preload adds a DOM without replacing Bun's runtime globals (see its header).
[test]
preload = ["./web/app/dom-preload.ts"]
# HOW-42: the A/B case set ships a tiny repo whose tests belong to THAT repo (they run inside an
# eval worktree), not to this suite
pathIgnorePatterns = ["reviser/eval/cases/**"]
