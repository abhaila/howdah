# CI is what GitHub auto-merge waits on. The publish step's `gh pr merge --auto` queues a PR, and
# main's branch protection requires the `test` job below, so a PR merges only once it is green.
# Without a required check, "auto-merge" on this repo merged the moment it was enabled.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # `bun run check` shells out to tsc, which runs under node; TypeScript 7 needs node >= 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      # many tests build throwaway git repos and commit in them
      - run: git config --global user.name ci && git config --global user.email ci@localhost && git config --global init.defaultBranch main
      - run: bun test
